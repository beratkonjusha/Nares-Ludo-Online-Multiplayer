function updateOnlineSelfView(){
 if(!online.active||!online.myKey)return;
 const me=online.players.find(p=>String(p.id)===online.myKey);if(!me)return;
 const nameEl=$('onName'),colorEl=$('onColor');
 if(nameEl && document.activeElement!==nameEl)nameEl.value=String(me.name||'');
 if(colorEl){const taken=new Set(online.players.filter(p=>String(p.id)!==online.myKey).map(p=>p.color));[...colorEl.options].forEach(o=>{o.disabled=taken.has(o.value)&&o.value!==me.color;o.textContent=colorName(o.value)+(taken.has(o.value)&&o.value!==me.color?' — vergeben':'')});if(document.activeElement!==colorEl)colorEl.value=me.color;}
 const locked=!!me.ready;
 if(nameEl)nameEl.disabled=locked;if(colorEl)colorEl.disabled=locked;if($('onFile'))$('onFile').disabled=locked;
 $('readyBtn').disabled=locked;$('readyBtn').textContent=locked?t('readyText'):t('ready');
}
function renderOnlineStatus(){if(!online.active)return;const list=online.players||[];$('roomStatus').innerHTML=`<b>${list.length}/${online.targetCount}</b>`+list.map(p=>`<div class="online-row"><img src="${p.image||''}"><span><b>${esc(p.name||'…')}</b><br><small>${esc(colorNameFor(p.color,p.lang||lang))} · ${esc(p.lang==='sq'?'Shqip':p.lang==='en'?'English':'Deutsch')}</small></span><span class="pill">${p.ready?t('readyText'):t('notReady')}</span></div>`).join('')}
function colorNameFor(c,l){return NAMES[c]?.[l]||c}
function onlineUpdateSelf(rebuild=false){if(!online.active||!online.myKey)return;let me=online.players.find(p=>String(p.id)===online.myKey);if(!me||me.ready)return;const taken=online.players.some(p=>String(p.id)!==online.myKey&&p.color===setup[0].color);if(taken){$('onlineNotice').textContent=t('invalid');return}$('onlineNotice').textContent='';me.name=setup[0].name.slice(0,24);me.color=setup[0].color;me.image=setup[0].image;me.lang=lang;send({type:'config',player:{id:me.id,name:me.name,color:me.color,image:me.image,lang:me.lang}});if(online.host){renderOnlineStatus();broadcast({type:'room',players:online.players,targetCount:online.targetCount});}if(rebuild)updateOnlineSelfView()}
$('createRoom').onclick=()=>{$('onlineHome').classList.add('hidden');$('createPanel').classList.remove('hidden')};$('joinRoom').onclick=()=>{$('onlineHome').classList.add('hidden');$('joinPanel').classList.remove('hidden')};
let onlineCount=2;document.querySelectorAll('#onlineCounts .mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('#onlineCounts .mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');onlineCount=+b.dataset.count});
$('makeRoom').onclick=async()=>{await createOnlineRoom(onlineCount)};
$('connectRoom').onclick=async()=>{const code=$('roomInput').value.replace(/\D/g,'').slice(0,6);if(code.length!==6){$('joinNotice').textContent=t('roomMissing');return}await joinOnlineRoom(code)};
async function createOnlineRoom(target){onlineReset(false);online.active=true;online.host=true;online.targetCount=target;online.myKey=newKey();online.myId=online.myKey;let code=randomCode();let tries=0;await new Promise((resolve,reject)=>{const attempt=()=>{tries++;online.peer=new Peer(code,{debug:0});online.peer.on('open',id=>{online.code=id;online.connected=true;online.players=[{id:online.myKey,name:'',color:COLORS[0],image:null,lang,ready:false}];resolve()});online.peer.on('connection',c=>hostAccept(c));online.peer.on('error',e=>{if(tries<5&&e.type==='unavailable-id'){try{online.peer.destroy()}catch(_){}code=randomCode();setTimeout(attempt,100);return}reject(e)});online.peer.on('disconnected',()=>{online.connected=false})};attempt()});$('createPanel').classList.add('hidden');openRoomPanel();toast(online.code)}
async function joinOnlineRoom(code){
 $('joinNotice').textContent=t('waiting');$('connectRoom').disabled=true;
 onlineReset(false);online.active=true;online.host=false;online.code=String(code);online.myKey=newKey();online.joined=false;
 const fail=msg=>{
   if(!online.active)return;
   $('joinNotice').textContent=msg||t('roomMissing');
   $('connectRoom').disabled=false;
   try{if(online.peer)online.peer.destroy()}catch(_){}
   onlineReset(false);
   $('joinPanel').classList.remove('hidden');
   $('roomPanel').classList.add('hidden');
 };
 try{
  online.peer=new Peer(undefined,{debug:0});
  online.peer.on('open',id=>{
    online.myId=id;
    const c=online.peer.connect(online.code,{reliable:true,serialization:'json',metadata:{app:'NaresLudo',version:1}});
    online.conns.set('host',c);
    bindConn(c,true);
    const timer=setTimeout(()=>{if(!online.joined)fail(t('roomMissing'))},10000);
    c.on('open',()=>{clearTimeout(timer);online.connected=true;c.send({type:'hello',key:online.myKey,version:1});});
  });
  online.peer.on('error',e=>{
    if(e.type==='peer-unavailable'||e.type==='server-error'||e.type==='socket-error')fail(t('roomMissing'));
    else if(e.type==='network')fail(t('connection'));
    else fail(e.message||t('roomMissing'));
  });
  online.peer.on('disconnected',()=>{online.connected=false;if(online.active&&!online.joined)fail(t('connection'));else if(online.active)scheduleReconnect()});
 }catch(e){fail(e?.message||t('roomMissing'));return}
 $('joinPanel').classList.add('hidden');
 $('roomPanel').classList.remove('hidden');
 $('roomCode').textContent=code;
 $('roomStatus').innerHTML='<div class="notice">'+esc(t('waiting'))+'</div>';
 $('onlineSelfConfig').innerHTML='';
 $('readyBtn').disabled=true;
 $('connectRoom').disabled=false;
}
function openRoomPanel(){$('roomPanel').classList.remove('hidden');$('roomCode').textContent=online.code||'------';renderOnlineSelf();renderOnlineStatus()}
function hostAccept(c){online.conns.set(c.peer,c);bindConn(c,false)}
function bindConn(c,isClient){
 c.on('open',()=>{
   online.connected=true;
   if(isClient){
     c.send({type:'hello',key:online.myKey,version:1});
   }else{
     c.send({type:'helloAck',host:true,version:1});
     c.send({type:'room',players:online.players,targetCount:online.targetCount,host:true});
   }
 });
 c.on('data',msg=>handleOnlineMessage(msg,c));
 c.on('close',()=>{
   online.conns.delete(c.peer);
   if(online.host){
     const idx=online.players.findIndex(p=>String(p.peerId)===String(c.peer));
     if(idx>0){online.players.splice(idx,1);broadcast({type:'room',players:online.players,targetCount:online.targetCount});}
     renderOnlineStatus();
   }else if(online.active){scheduleReconnect();}
 });
 c.on('error',()=>{if(!online.host&&online.active)scheduleReconnect()});
}
function send(msg){const c=online.conns.get('host');if(c&&c.open)c.send(msg)}function broadcast(msg){for(const c of online.conns.values())if(c.open)c.send(msg)}
function handleOnlineMessage(msg,c){if(!msg)return;if(online.host){if(msg.type==='hello'){
 const exists=online.players.find(p=>String(p.id)===String(msg.key));
 if(exists){exists.peerId=c.peer;}
 else{
   if(online.players.length>=online.targetCount){c.send({type:'error',message:t('roomFull')});return;}
   const freeColor=COLORS.find(x=>!online.players.some(p=>p.color===x))||'blue';
   online.players.push({id:msg.key,peerId:c.peer,name:'',color:freeColor,image:null,lang:'en',ready:false});
 }
 c.send({type:'helloAck',host:true,version:1});
 c.send({type:'room',players:online.players,targetCount:online.targetCount,host:true});
 broadcast({type:'room',players:online.players,targetCount:online.targetCount});
 return}if(msg.type==='config'){const p=online.players.find(x=>String(x.id)===String(msg.player?.id));if(!p||p.ready)return;if(online.players.some(x=>x!==p&&x.color===msg.player.color)){c.send({type:'error',message:'COLOR_TAKEN'});return}Object.assign(p,{name:String(msg.player.name||'').slice(0,24),color:msg.player.color,image:typeof msg.player.image==='string'?msg.player.image:null,lang:msg.player.lang||'en'});
c.send({type:'room',players:online.players,targetCount:online.targetCount,host:true});
broadcast({type:'room',players:online.players,targetCount:online.targetCount});
maybeStartOnline();return}if(msg.type==='ready'){const p=online.players.find(x=>String(x.id)===String(msg.id));if(p){p.ready=!!msg.ready;broadcast({type:'room',players:online.players,targetCount:online.targetCount});maybeStartOnline()}return}if(msg.type==='roll'){const p=online.players.find(x=>String(x.id)===String(msg.id));const pi=players.findIndex(x=>String(x.id)===String(msg.id));if(p&&pi===current&&diceValue===null&&!busy&&!paused){doRoll(pi,true)}return}if(msg.type==='move'){const p=online.players.find(x=>String(x.id)===String(msg.id));if(p&&String(players[current]?.id)===String(p.id)&&diceValue!==null){move(Number(msg.token),true)}return}if(msg.type==='pauseRequest'){paused=!!msg.paused;broadcast({type:'pause',paused});updateUI();return}}
if(msg.type==='helloAck'){online.connected=true;online.joined=true;return}
if(msg.type==='room'){
 online.players=Array.isArray(msg.players)?msg.players:[];
 online.targetCount=msg.targetCount||2;
 if(!online.host)online.joined=true;
 if($('roomPanel').classList.contains('hidden'))openRoomPanel();
 if(document.activeElement?.id==='onName'||document.activeElement?.id==='onColor')updateOnlineSelfView();
 else renderOnlineSelf();
 renderOnlineStatus();
 if(!online.host){$('readyBtn').disabled=false;$('joinNotice').textContent='';}
 return
}if(msg.type==='error'){if(msg.message==='COLOR_TAKEN'){$('onlineNotice').textContent='Diese Farbe ist bereits vergeben.'}else $('onlineNotice').textContent=msg.message;return}if(msg.type==='start'){online.players=msg.players;startOnlineGame(false,msg.state);return}if(msg.type==='dice'){diceValue=msg.value;setDice(diceValue);$('dice').classList.remove('rolling');void $('dice').offsetWidth;$('dice').classList.add('rolling');beep(420,.09);updateUI();return}if(msg.type==='step'){if(players[msg.pi]){players[msg.pi].tokens[msg.ti]=msg.value;renderTokens();beep(210+msg.value*4,.035,'triangle')}return}if(msg.type==='state'){applyState(msg.state);return}if(msg.type==='pause'){paused=!!msg.paused;$('pauseOverlay').classList.toggle('hidden',!paused);updateUI();return}if(msg.type==='win'){const p=players[msg.pi];running=false;showModal('🏆 '+esc(p.name)+' '+t('win'),`<p>${esc(p.name)} hat alle 4 Figuren im Ziel.</p><button class="btn primary" id="newGame">Neues Spiel</button>`);$('newGame').onclick=()=>{closeModal();openMenu()};return}}
function maybeStartOnline(){if(!online.host)return;if(online.players.length!==online.targetCount)return;if(!online.players.every(p=>p.name.trim()&&p.ready&&p.color&&p.id)){return}players=online.players.map((p,i)=>({id:p.id,name:p.name,color:p.color,image:p.image,ai:false,tokens:[-1,-1,-1,-1],finished:0,lang:p.lang}));current=0;diceValue=null;running=true;paused=false;noMoveRolls=0;createGrid();renderHomes();broadcast({type:'start',players,state:serializeState()});startOnlineGame(true,serializeState())}
function startOnlineGame(host,state){$('menu').classList.add('hidden');$('app').classList.remove('hidden');running=true;startMusic();applyState(state||serializeState());updateUI();setAnnouncement(players[current]);if(host)log('🌐 Online-Spiel gestartet.')}
$('readyBtn').onclick=()=>{if(!online.active)return;const me=online.players.find(p=>String(p.id)===online.myKey);if(!me)return;if(!setup[0].name.trim()){ $('onlineNotice').textContent=t('invalid');return}if(online.players.some(p=>String(p.id)!==online.myKey&&p.color===setup[0].color)){ $('onlineNotice').textContent='Diese Farbe ist bereits vergeben.';return}me.name=setup[0].name.trim();me.color=setup[0].color;me.image=setup[0].image;me.lang=lang;me.ready=true;online.ready=true;if(online.host){maybeStartOnline();renderOnlineStatus();renderOnlineSelf();broadcast({type:'room',players:online.players,targetCount:online.targetCount});}else{send({type:'config',player:me});send({type:'ready',id:online.myKey,ready:true});renderOnlineStatus();updateOnlineSelfView()}};
$('copyCode').onclick=async()=>{try{await navigator.clipboard.writeText(online.code)}catch(_){const ta=document.createElement('textarea');ta.value=online.code;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}toast(t('copied'))};
function scheduleReconnect(){if(!online.active||online.host||online.reconnectTimer)return;$('onlineNotice').textContent=t('connection');online.reconnectTimer=setInterval(()=>{if(!online.active)return;try{const c=online.peer.connect(online.code,{reliable:true});online.conns.set('host',c);bindConn(c,true);clearInterval(online.reconnectTimer);online.reconnectTimer=null}catch(_){}} ,2000)}
function clearOnlineGame(){if(online.host)broadcast({type:'state',state:serializeState()})}
function onlineReset(destroy=true){if(destroy&&online.peer){try{online.peer.destroy()}catch(_){}}if(online.reconnectTimer)clearInterval(online.reconnectTimer);online={active:false,host:false,code:'',peer:null,conns:new Map(),myId:'',myKey:'',targetCount:2,ready:false,players:[],connected:false,reconnectTimer:null,joined:false};}

// On page load: fresh menu. Temporary in-memory/session state is intentionally not reused after a full reload.
function init(){setI18n();createGrid();$('musicBtn').textContent='🔊';}
init();
</script>
